{% extends "base.html" %}

{% block title %}
Login - ProjectFlow
{% endblock %}


{% block content %}

<div class="auth-container">

    <div class="auth-card">

        <h2 class="text-center mb-4">
            Welcome Back
        </h2>

        <p class="text-center text-muted">
            Login to manage your projects.
        </p>

        <form method="POST">

            {% csrf_token %}

            <div class="mb-3">

                <label class="form-label">
                    Username
                </label>

                <input
                    type="text"
                    name="username"
                    class="form-control"
                    placeholder="Enter username"
                    required
                >

            </div>


            <div class="mb-3">

                <label class="form-label">
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    class="form-control"
                    placeholder="Enter password"
                    required
                >

            </div>


            <button
                type="submit"
                class="btn btn-primary w-100"
            >
                Login
            </button>

        </form>


        <p class="text-center mt-3">

            Don't have an account?

            <a href="{% url 'register' %}">
                Register
            </a>

        </p>

    </div>

</div>

{% endblock %}
