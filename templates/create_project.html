{% extends "base.html" %}

{% block content %}

<div class="container">

    <!-- =====================================================
         CREATE PROJECT PAGE
         ===================================================== -->

    <div class="page-header">

        <h1>Create New Project</h1>

        <p>
            Create a project and start collaborating with your team.
        </p>

    </div>


    <!-- =====================================================
         PROJECT FORM
         ===================================================== -->

    <div class="form-card">

        <form method="POST">

            <!-- CSRF protection -->
            {% csrf_token %}

            <!-- Display form fields -->
            {{ form.as_p }}

            <!-- Submit button -->
            <button
                type="submit"
                class="btn btn-primary"
            >
                Create Project
            </button>

            <!-- Cancel button -->
            <a
                href="{% url 'dashboard' %}"
                class="btn btn-secondary"
            >
                Cancel
            </a>

        </form>

    </div>

</div>

{% endblock %}
